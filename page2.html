<script>
const photos = [
    { id: 1, category: 'landscape', img: 'landscape1.webp' },
    { id: 2, category: 'portrait',  img: 'Porttrait2.webp' },
    { id: 3, category: 'portrait',  img: 'portrait1.webp' },
    { id: 4, category: 'landscape', img: 'landscape2.webp' },
    { id: 5, category: 'portrait',  img: 'portrait5.webp' },
    { id: 6, category: 'landscape', img: 'landscape3.webp' },
    { id: 7, category: 'portrait',  img: 'portrait6.webp' },
    { id: 8, category: 'landscape', img: 'landscape4.webp' },
    { id: 9, category: 'portrait',  img: 'porttrait3.webp' }
];

const galleryContainer = document.getElementById('photo-gallery');
const filterButtons = document.querySelectorAll('.filter-btn');


function renderGallery(filterName) {
    galleryContainer.innerHTML = '';
    const filtered = filterName === 'all' 
        ? photos 
        : photos.filter(p => p.category === filterName);

    filtered.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${photo.img}" alt="Photography">`;
        galleryContainer.appendChild(card);
    });
}

filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        // Меняем активную кнопку
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Перерисовываем
        renderGallery(btn.getAttribute('data-filter'));
    });
});

document.addEventListener('DOMContentLoaded', () => {
    renderGallery('all');
});
</script>
